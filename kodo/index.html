  <title>KŌDŌ — 行動設計</title>
</head>
<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <script>
/** Parallel-work model. The second task already exists in the original workflow.
 * A machine's unattended waiting time is elapsed time, not human labor.
 * The result is conditional on safety and dependency checks supplied by the user.
 */
const OVERLAP_MAX = 500;
const validNumber = n => typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= 100000;
const validText = s => typeof s === 'string' && s.trim().length > 0 && s.length <= 120;

function validateOverlapPlan(plan) {
  if (!plan || typeof plan !== 'object' || !validText(plan.id) || !validText(plan.name) ||
      !validText(plan.waitTask) || !validText(plan.otherTask) ||
      !['safeConfirmed','independentConfirmed','existingWorkConfirmed'].every(k => typeof plan[k] === 'boolean') ||
      !Number.isInteger(plan.weeklyFrequency) || plan.weeklyFrequency < 1 || plan.weeklyFrequency > 10000) {
    throw new Error('並行作業の名前・条件・頻度を確認してください。');
  }
  for (const k of ['setupMinutes', 'waitMinutes', 'otherMinutes', 'finishMinutes', 'switchMinutes']) {
    if (plan[k] !== null && !validNumber(plan[k])) throw new Error('計測時間は0以上の数値か、未測定にしてください。');
  }
  if (plan.waitMinutes === 0 || plan.otherMinutes === 0) throw new Error('待ち時間と別の作業時間は0分より長くしてください。');
  return true;
}
const rounded = n => Math.round(n * 100) / 100;
function calculateOverlap(plan, weeks=12) {
  validateOverlapPlan(plan);
  if (!Number.isInteger(weeks) || weeks < 1 || weeks > 260) throw new Error('評価期間は1〜260週です。');
  const safe = plan.safeConfirmed && plan.independentConfirmed && plan.existingWorkConfirmed;
  const missing = ['setupMinutes','waitMinutes','otherMinutes','finishMinutes','switchMinutes'].filter(k=>plan[k] === null);
  const base = {status:!safe?'unconfirmed':missing.length?'unmeasured':'ready',missing, safe, weeks,
    constraints:{safeConfirmed:plan.safeConfirmed,independentConfirmed:plan.independentConfirmed,existingWorkConfirmed:plan.existingWorkConfirmed}};
  // Do not assert real savings when unknown times or safety constraints are pending.
  if (!safe || missing.length) return {...base,serialElapsed:null,parallelElapsed:null,savedEach:null,savedWeekly:null,savedPeriod:null,laborBefore:null,laborAfter:null,laborExtra:null};
  const {setupMinutes:setup,waitMinutes:wait,otherMinutes:other,finishMinutes:finish,switchMinutes:shift,weeklyFrequency:freq}=plan;
  const serialElapsed = setup + wait + other + finish;
  const parallelElapsed = setup + Math.max(wait, other + shift) + finish;
  const laborBefore = setup + other + finish;
  const laborAfter = laborBefore + shift;
  const savedEach=rounded(serialElapsed-parallelElapsed);
  return {...base,status:savedEach>0?'improved':savedEach<0?'worse':'equal',
    serialElapsed:rounded(serialElapsed),parallelElapsed:rounded(parallelElapsed),
    savedEach,savedWeekly:rounded(savedEach*freq),savedPeriod:rounded(savedEach*freq*weeks),
    laborBefore:rounded(laborBefore),laborAfter:rounded(laborAfter),laborExtra:rounded(shift)};
}

/** Input intentionally keeps blank values unknown, rather than inventing durations. */
function overlapFromForm(fields, id) {
  const number = k => fields[k] === '' || fields[k] === null || fields[k] === undefined ? null : Number(fields[k]);
  const p={id,name:String(fields.name||'').trim(),waitTask:String(fields.waitTask||'').trim(),otherTask:String(fields.otherTask||'').trim(),
    setupMinutes:number('setupMinutes'),waitMinutes:number('waitMinutes'),otherMinutes:number('otherMinutes'),finishMinutes:number('finishMinutes'),switchMinutes:number('switchMinutes'),
    weeklyFrequency:Number(fields.weeklyFrequency),safeConfirmed:fields.safeConfirmed===true,
    independentConfirmed:fields.independentConfirmed===true,existingWorkConfirmed:fields.existingWorkConfirmed===true};
  validateOverlapPlan(p);
  return p;
}




/** 行動分析はフロントエンドとテストの両方で使う純粋関数に分離。 */
function getScenarioActions(data, scenarioId) {
  return data.actions.filter(a => a.scenarioId === scenarioId);
}
function getScenarioLinks(data, scenarioId) {
  return data.links.filter(l => l.scenarioId === scenarioId);
}
function weeklyMinutes(action) {
  return Number(action.minutes ?? 0) * Number(action.frequency || 0);
}
function weeklyYen(action) {
  return Number(action.yen || 0) * Number(action.frequency || 0);
}
function scenarioTotals(data, scenarioId) {
  const actions = getScenarioActions(data, scenarioId);
  return {
    minutes: Math.round(actions.reduce((sum, a) => sum + weeklyMinutes(a), 0) * 10) / 10,
    yen: Math.round(actions.reduce((sum, a) => sum + weeklyYen(a), 0)),
    count: actions.length,
    unmeasured: actions.filter(a => a.minutes === null || a.minutes === undefined || a.minutes === '').length,
  };
}

/**
 * Remove the selected action, then only remove its consequences when ALL their
 * causal triggers have disappeared. An essential action remains and is reported
 * as a broken dependency. Sequential ('precedes') links never imply removal.
 * A cause-free action is independent and therefore remains.
 */
function simulateRemoval(data, scenarioId, actionId) {
  const actions = getScenarioActions(data, scenarioId);
  const nodes = new Map(actions.map(a => [a.id, a]));
  if (!nodes.has(actionId)) return { removed: [], broken: [], minutes: 0, yen: 0, essentialRemoved: false };
  const links = getScenarioLinks(data, scenarioId).filter(l => l.type === 'causes');
  const removed = new Set([actionId]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const a of actions) {
      if (removed.has(a.id) || a.essential) continue;
      const incoming = links.filter(l => l.toId === a.id);
      if (incoming.length > 0 && incoming.every(l => removed.has(l.fromId))) {
        removed.add(a.id);
        changed = true;
      }
    }
  }
  const broken = actions.filter(a => !removed.has(a.id) && a.essential &&
    links.some(l => l.toId === a.id) &&
    links.filter(l => l.toId === a.id).every(l => removed.has(l.fromId))
  ).map(a => a.id);
  const rem = actions.filter(a => removed.has(a.id));
  return {
    removed: [...removed],
    broken,
    minutes: Math.round(rem.reduce((sum, a) => sum + weeklyMinutes(a), 0) * 10) / 10,
    yen: Math.round(rem.reduce((sum, a) => sum + weeklyYen(a), 0)),
    essentialRemoved: rem.some(a => a.essential),
  };
}

/** Reject edges that introduce a cycle, including those across link types. */
function canLink(data, scenarioId, fromId, toId) {
  if (fromId === toId) return false;
  const nodes = new Set(getScenarioActions(data, scenarioId).map(a => a.id));
  if (!nodes.has(fromId) || !nodes.has(toId)) return false;
  const links = getScenarioLinks(data, scenarioId);
  if (links.some(l => l.fromId === fromId && l.toId === toId)) return false;
  const descendants = new Map();
  for (const l of links) {
    if (!descendants.has(l.fromId)) descendants.set(l.fromId, []);
    descendants.get(l.fromId).push(l.toId);
  }
  const visited = new Set();
  const stack = [toId];
  while (stack.length) {
    const next = stack.pop();
    if (next === fromId) return false;
    if (visited.has(next)) continue;
    visited.add(next);
    stack.push(...(descendants.get(next) || []));
  }
  return true;
}

function buildLayout(actions, links) {
  const position = {};
  const levels = new Map(actions.map(a => [a.id, 0]));
  for (let i = 0; i < actions.length; i++) {
    let changed = false;
    for (const l of links) {
      if (!levels.has(l.fromId) || !levels.has(l.toId)) continue;
      const candidate = levels.get(l.fromId) + 1;
      if (candidate > levels.get(l.toId)) { levels.set(l.toId, candidate); changed = true; }
    }
    if (!changed) break;
  }
  const cols = new Map();
  actions.forEach(a => {
    const level = Math.min(15, levels.get(a.id) || 0);
    if (!cols.has(level)) cols.set(level, []);
    cols.get(level).push(a);
  });
  const maxRows = Math.max(1, ...[...cols.values()].map(c => c.length));
  const width = Math.max(740, (Math.max(...cols.keys(), 0) + 1) * 246 + 56);
  const height = Math.max(320, maxRows * 112 + 76);
  for (const [level, arr] of cols) {
    arr.forEach((a, index) => {
      position[a.id] = { x: 30 + level * 246, y: 42 + index * 112 + (maxRows - arr.length) * 56 };
    });
  }
  return { position, width, height };
}

function fmtMin(value) { return `${Number(value).toLocaleString('ja-JP', { maximumFractionDigits: 1 })}分`; }
function fmtYen(value) { return `¥${Math.round(Number(value)).toLocaleString('ja-JP')}`; }

function validateImport(raw) {
  if (!raw || typeof raw !== 'object' || ![1,2].includes(raw.version)) throw new Error('対応していないデータ形式です。');
  const collections = ['goals', 'scenarios', 'actions', 'links', 'experiments', ...(raw.version===2?['items','actionItems']:[]), ...(raw.timeLogs!==undefined?['timeLogs']:[])];
  if (collections.some(k => !Array.isArray(raw[k]))) throw new Error('必要なデータ項目がありません。');
  if ([...raw.goals, ...raw.scenarios, ...raw.actions, ...raw.links, ...raw.experiments].length > 5000) throw new Error('データ件数が多すぎます。');
  const unique = arr => arr.every((v, i) => v && typeof v.id === 'string' && v.id.length <= 100 && arr.findIndex(x => x.id === v.id) === i);
  if (collections.some(k => !unique(raw[k]))) throw new Error('IDの重複または不正なデータがあります。');
  const goalIds = new Set(raw.goals.map(x => x.id));
  const scenarios = new Map(raw.scenarios.map(x => [x.id, x]));
  const actions = new Map(raw.actions.map(x => [x.id, x]));
  for (const s of raw.scenarios) {
    if (!goalIds.has(s.goalId) || typeof s.name !== 'string' ||
        ['setupMinutes','setupYen','managementMinutesPerWeek'].some(k=>
          s[k] !== undefined && s[k] !== null && (!Number.isFinite(s[k]) || s[k] < 0 || s[k] > 1000000)))
      throw new Error('方法の参照先または時間設定が不正です。');
  }
  for (const s of raw.scenarios) { if (s.returns !== undefined && s.returns !== null) validateReturns(s.returns); }
  for (const a of raw.actions) {
    if (!scenarios.has(a.scenarioId) || typeof a.name !== 'string' || (a.minutes !== null && (!Number.isFinite(Number(a.minutes)) || Number(a.minutes) < 0)) || [a.frequency,a.yen].some(v => !Number.isFinite(Number(v)) || Number(v) < 0)) throw new Error('行動データが不正です。');
  }
  for (const l of raw.links) if (!scenarios.has(l.scenarioId) || !actions.has(l.fromId) || !actions.has(l.toId) || actions.get(l.fromId).scenarioId !== l.scenarioId || actions.get(l.toId).scenarioId !== l.scenarioId || !['causes','precedes'].includes(l.type)) throw new Error('行動同士の関連に不整合があります。');
  if (raw.timeLogs !== undefined) {
    if (!Array.isArray(raw.timeLogs) || raw.timeLogs.length>5000) throw new Error('実測記録が多すぎます。');
    for(const log of raw.timeLogs) {
      if(!goalIds.has(log.goalId)||!scenarios.has(log.scenarioId)||scenarios.get(log.scenarioId).goalId!==log.goalId||!Number.isInteger(log.durationSeconds)||log.durationSeconds<1||log.durationSeconds>172800||typeof log.createdAt!=='string'||!Number.isFinite(Date.parse(log.createdAt))) throw new Error('実測記録が不正です。');
    }
  }
  if (raw.version===2) {
    const items=new Map(raw.items.map(x=>[x.id,x]));
    for(const item of raw.items){
      if(!goalIds.has(item.goalId)||typeof item.name!=='string'||typeof item.home!=='string'||typeof item.note!=='string'||(item.placement!==undefined&&!['workspace','storage','undecided'].includes(item.placement)))throw new Error('道具のデータが不正です。');
    }
    const pairs=new Set();
    for(const rel of raw.actionItems){
      const pair=`${rel.itemId}:${rel.actionId}`;if(pairs.has(pair))throw new Error('道具と行動の関係が重複しています。');pairs.add(pair);
      const item=items.get(rel.itemId),a=actions.get(rel.actionId);
      if(!item||!a||scenarios.get(a.scenarioId)?.goalId!==item.goalId)throw new Error('道具と行動の関係が不正です。');
    }
  }
  if (raw.overlapPlans !== undefined) {
    if (!Array.isArray(raw.overlapPlans) || raw.overlapPlans.length > OVERLAP_MAX) throw new Error('並行作業の登録件数が多すぎます。');
    if (!unique(raw.overlapPlans)) throw new Error('並行作業のIDが不正です。');
    for (const plan of raw.overlapPlans) validateOverlapPlan(plan);
  }
  return raw;
}

/** v0.1 browser backups and existing localStorage are preserved and upgraded. */
function migrateData(raw) {
  validateImport(raw);
  if(raw.version===2) return {...raw,overlapPlans:raw.overlapPlans||[],timeLogs:raw.timeLogs||[],items:raw.items.map(item=>({...item,placement:item.placement||'undecided'}))};
  return {...raw,version:2,items:[],actionItems:[],timeLogs:raw.timeLogs||[],overlapPlans:[]};
}



/** A complete life-cycle comparison, not a proxy based on number of actions.
 * All values are minutes, per-week recurring actions plus one-off setup.
 * Unknown action durations propagate into an explicitly incomplete result.
 */
function projectTime(data, scenarioId, weeks=12) {
  if (!Number.isInteger(weeks) || weeks < 1 || weeks > 260) throw new Error('評価期間は1〜260週です。');
  const scenario=data.scenarios.find(s=>s.id===scenarioId);
  if (!scenario) throw new Error('方法がありません。');
  const recurring=scenarioTotals(data,scenarioId);
  const setupMinutes=scenario.setupMinutes??0;
  const managementMinutesPerWeek=scenario.managementMinutesPerWeek??0;
  const setupYen=scenario.setupYen??0;
  const weeklyMinutes=Math.round((recurring.minutes+managementMinutesPerWeek)*10)/10;
  return {
    scenarioId, weeks,
    actionCount:recurring.count, unmeasured:recurring.unmeasured,
    actionWeeklyMinutes:recurring.minutes,
    managementMinutesPerWeek, setupMinutes,
    weeklyMinutes, totalMinutes:Math.round((setupMinutes+weeklyMinutes*weeks)*10)/10,
    weeklyYen:recurring.yen, setupYen,
    totalYen:Math.round(setupYen+recurring.yen*weeks),
    complete:recurring.unmeasured===0,
  };
}

function compareTime(data, baseId, optionId, weeks=12) {
  const base=projectTime(data,baseId,weeks), option=projectTime(data,optionId,weeks);
  const savedMinutes=Math.round((base.totalMinutes-option.totalMinutes)*10)/10;
  const recurringSavedMinutes=Math.round((base.weeklyMinutes-option.weeklyMinutes)*10)/10;
  const setupDifferenceMinutes=Math.round((option.setupMinutes-base.setupMinutes)*10)/10;
  const complete=base.complete&&option.complete;
  const status=!complete?'incomplete':savedMinutes>0?'improved':savedMinutes<0?'worse':'equal';
  // Payback period only matters if the new method has higher upfront time.
  const paybackWeeks=recurringSavedMinutes>0
    ? Math.max(0,setupDifferenceMinutes)/recurringSavedMinutes
    : setupDifferenceMinutes>0 ? null : 0;
  return {base,option,complete,status,savedMinutes,recurringSavedMinutes,
    addedActions:option.actionCount-base.actionCount, paybackWeeks};
}

/** Measured overall elapsed effort during equal periods (including setup and overhead). */
function measuredTimeVerdict(before,after) {
  if(before===null||after===null||before===undefined||after===undefined) return null;
  if(!Number.isFinite(before)||!Number.isFinite(after)||before<0||after<0)return null;
  return {savedMinutes:Math.round((before-after)*10)/10,status:before>after?'improved':before<after?'worse':'equal'};
}



// Financial and time ledgers are deliberately independent. No arbitrary exchange
// between yen and minutes is made unless the user explicitly sets an hourly rate.
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => Math.round(n * 100) / 100;
const value = x => typeof x === 'number' && Number.isFinite(x) && x >= 0 && x <= 1e9;
const fields = ['cashIncomeOnce','cashIncomePerWeek','timeIncomeOnceMinutes','timeIncomePerWeekMinutes'];

function validateReturns(r) {
  if (!r || typeof r !== 'object' || Array.isArray(r)) throw new Error('収益の入力内容が不正です。');
  if (typeof r.qualityConfirmed !== 'boolean' || typeof r.note !== 'string' || r.note.length > 1000)
    throw new Error('成果の成立条件を確認してください。');
  if (fields.some(k => r[k] !== null && !value(r[k])))
    throw new Error('収益は0以上の数値か「未測定」にしてください。');
  return true;
}

function returnsFromForm(fieldsIn) {
  const r = {qualityConfirmed:fieldsIn.qualityConfirmed===true,note:String(fieldsIn.note||'').trim().slice(0,1000)};
  for (const k of fields) {
    const raw = fieldsIn[k];
    r[k] = raw === null || raw === undefined || String(raw).trim() === '' ? null : Number(raw);
  }
  validateReturns(r);
  return r;
}

function projectProfit(data, scenarioId, weeks=12, yenPerHour=null) {
  const cost=projectTime(data,scenarioId,weeks);
  const s=data.scenarios.find(x=>x.id===scenarioId);
  if (!s) throw new Error('方法がありません。');
  const r=s.returns || null;
  if (r !== null) validateReturns(r);
  if (yenPerHour !== null && !value(yenPerHour)) throw new Error('時間の評価額を確認してください。');
  const moneyKnown=!!r && value(r.cashIncomeOnce) && value(r.cashIncomePerWeek);
  const timeKnown=!!r && value(r.timeIncomeOnceMinutes) && value(r.timeIncomePerWeekMinutes) && cost.complete;
  const cashIncome=moneyKnown ? money(r.cashIncomeOnce + r.cashIncomePerWeek*weeks) : null;
  const timeIncome=timeKnown ? round2(r.timeIncomeOnceMinutes + r.timeIncomePerWeekMinutes*weeks) : null;
  const cashCost=cost.totalYen;
  const timeCost=cost.complete?cost.totalMinutes:null;
  const cashProfit=moneyKnown ? money(cashIncome-cashCost) : null;
  const timeProfit=timeKnown ? round2(timeIncome-timeCost) : null;
  const score = yenPerHour===null || cashProfit===null || timeProfit===null ? null : money(cashProfit+timeProfit/60*yenPerHour);
  return {
    scenarioId, weeks, cashIncome, timeIncome, cashCost, timeCost, cashProfit, timeProfit, score,
    cashKnown:moneyKnown, timeKnown, complete:moneyKnown&&timeKnown,
    qualityConfirmed:r?.qualityConfirmed===true,
    note:r?.note||'',
    cashIncomeOnce:r?.cashIncomeOnce??null, cashIncomePerWeek:r?.cashIncomePerWeek??null,
    timeIncomeOnceMinutes:r?.timeIncomeOnceMinutes??null, timeIncomePerWeekMinutes:r?.timeIncomePerWeekMinutes??null,
    cashRoi:moneyKnown && cashCost>0 ? round2(cashProfit/cashCost*100) : null,

/** Pareto status only when cash/time estimates are complete AND outcome quality is accepted. */
function compareProfit(data, baseId, optionId, weeks=12, yenPerHour=null) {
  const base=projectProfit(data,baseId,weeks,yenPerHour);
  const option=projectProfit(data,optionId,weeks,yenPerHour);
  const a=data.scenarios.find(s=>s.id===baseId), b=data.scenarios.find(s=>s.id===optionId);
  if (!a || !b || a.goalId!==b.goalId) throw new Error('同じ目的の方法だけを比較してください。');
  if (!base.complete || !option.complete) return {status:'incomplete',base,option,cashDiff:null,timeDiff:null,scoreDiff:null,qualityReady:false};
  const cashDiff=money(option.cashProfit-base.cashProfit);
  const timeDiff=round2(option.timeProfit-base.timeProfit);
  const scoreDiff=option.score===null ? null : money(option.score-base.score);
  const qualityReady=base.qualityConfirmed && option.qualityConfirmed;
  const status=!qualityReady?'unconfirmed':
    cashDiff>=0&&timeDiff>=0&&(cashDiff>0||timeDiff>0)?'dominates':
    cashDiff<=0&&timeDiff<=0&&(cashDiff<0||timeDiff<0)?'dominated':
    cashDiff===0&&timeDiff===0?'equal':'tradeoff';
  return {status,base,option,cashDiff,timeDiff,scoreDiff,qualityReady};
}


/** v0.9 — measure complete work cycles with a one-tap timer, including prep/cleanup. */
function timerKey(workspace) { return `kodo-work-timer:v1:${workspace}`; }

function timerElapsedMs(timer, now=Date.now()) {

function timeLogReport(data,goalId){

/** v0.2: 入力負担を小さくするための依存なし・オフライン補助関数。 */
const RULES = [
  { match: /タンブラー|水筒|マグボトル/, items: ['飲み物を準備する', '洗浄する', '乾かして収納する'] },
  { match: /ペットボトル|使い捨て容器/, items: ['購入する', '分別・廃棄する', '在庫を補充する'] },
  { match: /料理|調理|ご飯を作る/, items: ['材料を準備する', '調理器具を洗う', '作業台を片付ける'] },
  { match: /洗濯/, items: ['干す', '取り込む', 'たたんで収納する'] },
  { match: /掃除|清掃/, items: ['掃除道具を準備する', 'ごみを処理する', '道具を片付ける'] },
  { match: /木工|工作|加工|作業をする/, items: ['道具を準備する', '切りくずを片付ける', '道具を定位置に戻す'] },
  { match: /植物|灌水|水やり/, items: ['水やり道具を準備する', '使用後の道具を片付ける', '消耗品を補充する'] },
  { match: /買い物|購入する/, items: ['必要なものを確認する', '購入品を運ぶ', '収納する'] },
];
const GENERIC = ['準備する', '片付ける', '補充する', '保管する', '点検する'];

function parseActionLines(raw, existingNames = []) {
  const existing = new Set(existingNames.map(n => String(n).trim().toLocaleLowerCase('ja-JP')));
  const lines = String(raw ?? '').split(/\r?\n/).map(line => line.replace(/^\s*(?:[-*•・]|\d+[.)．、])\s*/, '').trim()).filter(Boolean);
  const names = []; const skipped = [];
  for (const line of lines) {
    const name = line.slice(0,100).trim();
    const key = name.toLocaleLowerCase('ja-JP');
    if (line.length > 100 || existing.has(key)) { skipped.push(line); continue; }
    existing.add(key); names.push(name);
    if (names.length >= 30) break;
  }
  return { names, skipped, truncated: lines.length > 30 };
}

function suggestNextActions(actionName, existingNames = [], max = 4) {
  const existing = existingNames.map(v => String(v));
  const chosen = RULES.filter(r => r.match.test(actionName)).flatMap(r => r.items);
  const items = chosen.length ? chosen : GENERIC;
  return [...new Set(items)].filter(n => !existing.some(e => e===n || e.includes(n) || n.includes(e) && e.length >= 4)).slice(0,max);
}

/** Only domain-specific hypotheses; avoid generic noise in free-text entry. */
function suggestSpecificConsequences(actionName, existingNames = [], max = 3) {
  const suggestions = RULES.filter(r=>r.match.test(actionName)).flatMap(r=>r.items);
  const normalized=new Set(existingNames.map(n=>String(n).trim().toLocaleLowerCase('ja-JP')));
  return [...new Set(suggestions)].filter(name=>!normalized.has(name.toLocaleLowerCase('ja-JP'))).slice(0,max);
}

function rankOpportunities(data, scenarioId, simulate, weekly) {
  return data.actions.filter(a => a.scenarioId===scenarioId && !a.essential).map(a=>{
    const simulation=simulate(data,scenarioId,a.id);
    return {action:a,simulation,minutes:simulation.minutes,ownMinutes:weekly(a)};
  }).filter(x=>!x.simulation.essentialRemoved && !x.simulation.broken.length && x.minutes>0)
    .sort((a,b)=>b.minutes-a.minutes || a.action.name.localeCompare(b.action.name,'ja')).slice(0,4);
}

function verifiedSavings(beforeMinutes, afterMinutes) {
  if (!Number.isFinite(beforeMinutes) || !Number.isFinite(afterMinutes) || beforeMinutes < 0 || afterMinutes < 0) return null;
  return Math.round((beforeMinutes-afterMinutes)*10)/10;
}


/**
 * 物を「使う行動」から逆引きする。未登録と不要は同義ではないため、
 * 廃棄の判断は提案するだけで自動実行しない。
 */
const PLACEMENTS = {
  workspace: '作業場所',
  storage: '別の保管場所',
  undecided: '置き場所を検討中',
};

function analyzeEnvironment(data, goalId, scenarioId) {
  const scenarios = data.scenarios.filter(s => s.goalId === goalId);
  const scenarioIds = new Set(scenarios.map(s => s.id));
  const scenarioActions = data.actions.filter(a => scenarioIds.has(a.scenarioId));
  const actionsById = new Map(scenarioActions.map(a => [a.id, a]));
  const itemUsage = new Map();
  for (const relation of data.actionItems) {
    const a = actionsById.get(relation.actionId);
    if (!a) continue;
    if (!itemUsage.has(relation.itemId)) itemUsage.set(relation.itemId, new Set());
    itemUsage.get(relation.itemId).add(a.id);
  }
  const rows = data.items.filter(item => item.goalId === goalId).map(item => {
    const usage = [...(itemUsage.get(item.id) || [])].map(id => actionsById.get(id)).filter(Boolean);
    const usedHere = usage.filter(a => a.scenarioId === scenarioId);
    const usedElsewhere = usage.filter(a => a.scenarioId !== scenarioId);
    const placement = PLACEMENTS[item.placement] ? item.placement : 'undecided';
    let status, advice, review = false;
    if (!usage.length) {
      status = '使い道が未登録';
      advice = placement === 'workspace'
        ? 'どの方法にも使用記録がありません。作業場所から外して保管・譲渡・処分の要否を検討しましょう。'
        : '必要になる具体的な行動を確認しましょう。未登録だけで不要と断定しません。';
      review = true;
    } else if (!usedHere.length) {
      status = 'ほかの方法で使用';
      advice = placement === 'workspace'
        ? '今選んだ方法では使いません。作業場所に常置する理由があるか見直しましょう。'
        : '今の方法では使わず、ほかの方法のために保管しています。';
      review = placement === 'workspace';
    } else if (!item.home?.trim()) {
      status = '定位置が未設定';
      advice = '実際に使う順序に合わせて戻す場所を決めましょう。';
      review = true;
    } else if (placement === 'undecided') {
      status = '配置を決める';
      advice = '使用する行動が確認できました。作業場所に置くか、別途保管するか決めましょう。';
      review = true;
    } else if (placement === 'storage') {
      status = '保管場所から使用';
      advice = '使うたびの取り出し・片付けが負担になっていないか確認しましょう。';
    } else {
      status = '現在の方法で使用';
      advice = '実際の動きから配置が合理的か確認しましょう。';
    }
    return { ...item, placement, usedHere, usedElsewhere, totalUsage: usage.length, status, advice, review };
  });
  rows.sort((a, b) => Number(b.review) - Number(a.review) || a.name.localeCompare(b.name, 'ja'));
  return {
    rows,
    usedHere: rows.filter(r => r.usedHere.length).length,
    review: rows.filter(r => r.review).length,

    items: rows.length,
  };
}


/**
 * v0.3 Offline input assistant. This is deliberately not a generative-AI parser.
 * It only extracts explicitly separated clauses and explicitly marked links.
 * => / ⇒ denotes a user-specified cause; -> / → denotes order only.
 * Never infer a causal dependency from Japanese prose automatically.
 */
function classifyAction(name) {
  if (/洗|片付|乾か|廃棄|分別|点検|戻す|収納|補充|保守|処分|後始末|掃除/.test(name)) return 'maintenance';
  if (/作業する|加工する|飲む|料理する|製作する|制作する|植える|水やりする/.test(name)) return 'core';
  return 'support';
}

function parseNarrativeInput(raw, existingNames = [], max = 30) {
  const text = String(raw ?? '').slice(0, 5000);
  const existing = new Set(existingNames.map(s => String(s).trim().toLocaleLowerCase('ja-JP')));
  const steps = [];
  const links = [];
  const seen = new Map();
  const skipped = [];
  let truncated = false;
  const tokenize = text.split(/(=>|⇒|->|→|[。！？!?、;；\n\r])/u);
  let pending = null;
  let previous = null;
  for (const part of tokenize) {
    if (/^(=>|⇒|->|→)$/.test(part)) {
      pending = part === '⇒' || part === '=>' ? 'causes' : 'precedes';
      continue;
    }
    if (/^[。！？!?、;；\n\r]$/.test(part)) {
      if (part !== '、') previous = null;
      // Punctuation is not proof of causality or ordering.
      pending = null;
      continue;
    }
    const cleaned = part.replace(/^\s*(?:[-*・•]|\d+[.)．、])\s*/, '')
      .replace(/^\s*(?:まず|次に|それから|その後|最後に)[\s、]*/, '').trim();
    if (!cleaned || /^(?:朝|昼|夜|今朝|今日|昨日|明日|帰宅後|作業後|午前|午後)$/.test(cleaned)) continue;
    if (cleaned.length > 100) { skipped.push(cleaned.slice(0,120)); previous = null; pending = null; continue; }
    const key = cleaned.toLocaleLowerCase('ja-JP');
    let idx = seen.get(key);
    if (idx === undefined) {
      if (steps.length >= max) { truncated = true; previous = null; pending = null; continue; }
      idx = steps.length;
      seen.set(key, idx);
      steps.push({ name: cleaned, kind: classifyAction(cleaned), existing: existing.has(key) });
    }
    if (pending && previous !== null && previous !== idx && !links.some(l=>l.from===previous&&l.to===idx)) {
      links.push({from:previous,to:idx,type:pending});
    }
    previous = idx;
    pending = null;
  }
  return { steps, links, skipped, truncated };
}

/** Link explicit edges first; chronological links only when the user opts in. */
function planNarrativeLinks(parsed, activeIndices, connectInOrder) {
  const active = new Set(activeIndices);
  const result = parsed.links.filter(l => active.has(l.from) && active.has(l.to));
  if (connectInOrder) {
    for (let i=1; i<activeIndices.length; i++) {
      const from=activeIndices[i-1], to=activeIndices[i];
      if (from===to || result.some(l => l.from===from && l.to===to)) continue;
      result.push({from,to,type:'precedes'});
    }
  }
  return result;
}


/** Speech transcript payload. Whitespace-only normalization; never remove durations, negations or conditions. */
function prepareVoiceTranscript(value, max = 2500) {

  const text = value.replace(/\r\n?/g, '\n').replace(/[ \t\u3000]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if (!text) throw new Error('音声入力または文章入力をしてください。');

/** The AI only proposes; names and types must be reviewed by the user. */
function normalizeVoiceOrganization(raw, existingNames = []) {
  if (!raw || !Array.isArray(raw.steps) || typeof raw.summary !== 'string') throw new Error('AIの整理結果を読み取れませんでした。');
  if (raw.steps.length > 30) throw new Error('AIの行動候補が多すぎます。');
  const existing = new Set(existingNames.map(v=>String(v).trim().toLocaleLowerCase('ja-JP')));
  const seen = new Set();
  const steps = [];
  for (const item of raw.steps) {
    if (!item || typeof item.name !== 'string') throw new Error('AIが不正な行動候補を返しました。');
    const name = item.name.trim();
    if (!name || name.length > 100) throw new Error('AIが不正な行動名を返しました。');
    const key=name.toLocaleLowerCase('ja-JP');
    if (seen.has(key)) continue;

    const kind = ['core','support','maintenance'].includes(item.kind) ? item.kind : 'support';
    steps.push({name,kind,existing:existing.has(key)});
  }
  if (!steps.length) throw new Error('行動が見つかりませんでした。別の言い方でお試しください。');
  return {steps,links:[],suggestions:[],skipped:[],truncated:false,summary:raw.summary.trim().slice(0,500),viaAi:true};

/** KŌDŌ v0.6 recovery points and preflight diff for destructive sync/import.
 * Recovery points live only in this browser, and never replace JSON exports.
 */
const RECOVERY_KEY = 'kodo-recovery:v1';
const COLLECTIONS = ['goals', 'scenarios', 'actions', 'links', 'items', 'actionItems', 'experiments', 'timeLogs', 'overlapPlans'];
const LIMIT = 3;

function summarizeChanges(current, incoming) {
  if (!current || !incoming) throw new Error('比較対象のデータがありません。');
  const collections = {};
  for (const name of COLLECTIONS) {
    const before = Array.isArray(current[name]) ? current[name] : [];
    const after = Array.isArray(incoming[name]) ? incoming[name] : [];
    const from = new Map(before.map(x => [String(x.id), JSON.stringify(x)]));
    const to = new Map(after.map(x => [String(x.id), JSON.stringify(x)]));
    const added = [...to.keys()].filter(id => !from.has(id)).length;
    const removed = [...from.keys()].filter(id => !to.has(id)).length;
    const modified = [...to.keys()].filter(id => from.has(id) && to.get(id) !== from.get(id)).length;
    collections[name] = { before: before.length, after: after.length, added, removed, modified };
  }
  const different = COLLECTIONS.some(x => Object.entries(collections[x]).some(([k,v]) => ['added','removed','modified'].includes(k) && v > 0));
  return { different, collections };
}
function changeSummaryText(current, incoming) {
  const result = summarizeChanges(current,incoming);
  const names = {goals:'目的',scenarios:'方法',actions:'行動',links:'関係',items:'道具',actionItems:'紐付け',experiments:'検証',timeLogs:'実測',overlapPlans:'並行作業'};
  const parts = COLLECTIONS.flatMap(name => {
    const c = result.collections[name];
    if (!c.added && !c.removed && !c.modified) return [];
    return [`${names[name]}：追加${c.added}・削除${c.removed}・変更${c.modified}`];
  });
  return parts.length ? parts.join('\n') : '登録内容の差分はありません。';
}

function readRecoveryPoints(storage) {
  try {
    const saved = JSON.parse(storage.getItem(RECOVERY_KEY) || '[]');
    if (!Array.isArray(saved)) return [];
    return saved.filter(p => p && typeof p.reason === 'string' && typeof p.createdAt === 'string' && p.payload && typeof p.payload === 'object' && Array.isArray(p.payload.goals) && Array.isArray(p.payload.actions)).slice(0,LIMIT);
  } catch { return []; }
}
/** Save first, verify, then permit the destructive operation. */
function saveRecoveryPoint(storage, payload, reason, at = new Date().toISOString()) {
  const points = readRecoveryPoints(storage);
  const next = {createdAt: at, reason: String(reason).slice(0,120), payload: JSON.parse(JSON.stringify(payload))};
  // Preserve the latest three versions while avoiding an immediate duplicate.
  const rest = points.filter(x => JSON.stringify(x.payload) !== JSON.stringify(next.payload));
  const serialized = JSON.stringify([next, ...rest].slice(0,LIMIT));
  if (serialized.length > 6_000_000) throw new Error('復旧用データが大きすぎます。先にJSONを書き出してください。');
  try {
    storage.setItem(RECOVERY_KEY, serialized);
    if (storage.getItem(RECOVERY_KEY) !== serialized) throw new Error('保存結果を確認できません。');
  } catch {
    throw new Error('復旧ポイントを保存できません。ストレージ容量を確認し、JSONバックアップを取ってください。操作は中止しました。');
  }
  return next;
}


/** v0.8: isolate each signed-in account's local records and recovery points.
 * Browser localStorage is NOT encrypted; this prevents accidental cross-account display,
 * not access by someone who controls the same browser/device.
 */
const GUEST_WORKSPACE_KEY = 'kodo-design:v1';
const WORKSPACE_PREFIX = 'kodo-design:account:v1:';
const ACCOUNT_RECOVERY_PREFIX = 'kodo-recovery:account:v1:';

function workspaceKey(userId, projectUrl) {
  if (userId === null || userId === undefined) return GUEST_WORKSPACE_KEY;
  const id = String(userId).toLowerCase();
  if (!/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/.test(id)) throw new Error('アカウントIDが不正です。');
  const parsed = new URL(String(projectUrl));
  if(parsed.protocol !== 'https:' || !/^[a-z0-9-]+\.supabase\.co$/.test(parsed.hostname)) throw new Error('同期先が不正です。');
  return WORKSPACE_PREFIX + parsed.hostname + ':' + id;
}

function readWorkspace(storage, key, decode, empty) {
  const raw = storage.getItem(key);
  if (raw === null) return empty();
  // Malformed existing data must not be silently overwritten with a demo.
  try { return decode(JSON.parse(raw)); }
  catch { throw new Error('端末のデータを読み込めません。上書きせず、JSONバックアップを確認してください。'); }
}

function recoveryStorage(storage, key) {
  const namespace = key === GUEST_WORKSPACE_KEY ? null : ACCOUNT_RECOVERY_PREFIX + key.slice(WORKSPACE_PREFIX.length);
  return {
    getItem(name) { return storage.getItem(namespace ? `${namespace}:${name}` : name); },
    setItem(name, value) { return storage.setItem(namespace ? `${namespace}:${name}` : name, value); },
    removeItem(name) { return storage.removeItem(namespace ? `${namespace}:${name}` : name); }
  };
}

function hashPayload(payload) { // sync state detection; server CAS is the authoritative conflict control.
  const text=JSON.stringify(payload);let hash=2166136261;
  for(let i=0;i<text.length;i++)hash=Math.imul(hash^text.charCodeAt(i),16777619);
  return `${(hash>>>0).toString(16)}-${text.length}`;
}

async function bootstrapCloud() {
  if(!cloud?.userId)return;
  try {
    const remembered=JSON.parse(localStorage.getItem(CLOUD_LINK_KEY)||'null');
    const client=cloud, workspace=activeStore;
    const readStartHash=hashPayload(data);
    const remote=await client.readSnapshot();
    if(!isCurrentCloud(client,workspace))return;
    if(hashPayload(data)!==readStartHash) { cloudLinked=false;cloudStatus='クラウド確認中に端末が更新されました。手動で同期してください。';render();return; }
    if(!remembered || remembered.url!==cloud.config.url || remembered.userId!==cloud.userId) {cloudStatus=remote?'クラウドに記録があります。取得またはアップロードを選択してください':'クラウド未作成。最初のアップロードが必要です';render();return;}
    if(hashPayload(data)!==remembered.hash) {cloudStatus='この端末に未同期の編集があります。手動で同期方向を選択してください';render();return;}
    if(!remote){cloudStatus='クラウド側の記録がありません。手動でアップロードしてください';render();return;}
    const payload=migrateData(remote.payload);
    if(Number(remote.revision)!==Number(remembered.revision) && hashPayload(payload)!==hashPayload(data)) saveRecoveryPoint(recoveryScope(),data,'既知端末のクラウド自動取り込み前');
    cloud.revision=Number(remote.revision);cloudLinked=true;
    if(Number(remote.revision)!==Number(remembered.revision)){const before=deepCopy(data);data=deepCopy(payload);if(!saveLocal()){data=before;throw new Error('クラウド取得結果を端末に保存できません。');}selectedGoal=data.goals[0]?.id||null;selectedScenario=null;selectedAction=null;}
    lastSyncedHash=hashPayload(data);rememberCloudLink();cloudStatus='クラウドと同期済み';render();
  }catch(err){cloudLinked=false;cloudError=err.message;cloudStatus='クラウドに接続できません。ローカルデータはそのままです。';render();}
}
function scheduleCloudPush() {
  if(!cloudLinked||!cloud?.userId)return;
  cloudDirty=true;
  const client=cloud, workspace=activeStore;
  cloudQueue=cloudQueue.then(async()=>{
    if(!cloudDirty||!cloudLinked||!isCurrentCloud(client,workspace))return;
    const current=deepCopy(data), fingerprint=hashPayload(current);
    try {
      await client.writeSnapshot(current,client.revision);
      if(!isCurrentCloud(client,workspace))return;
      lastSyncedHash=fingerprint;rememberCloudLink();
      cloudDirty=hashPayload(data)!==fingerprint;
      cloudStatus=cloudDirty?'追加の変更を同期中':'クラウドと同期済み';cloudError='';
      if(cloudDirty)scheduleCloudPush();
    }catch(err){if(!isCurrentCloud(client,workspace))return;cloudLinked=false;cloudDirty=false;cloudStatus='同期停止（ローカル記録は保持）';cloudError=err.message;}
    if(activeTab==='cloud')render();
  }).catch(()=>{cloudLinked=false;cloudStatus='同期停止';});
}

function renderGraph(actions,links,sim) {

  return `<div class="graph-scroll" tabindex="0" aria-label="行動連鎖図。横にスクロールできます"><div class="graph-canvas" style="width:${layout.width}px;height:${layout.height}px"><div class="graph-dots"></div><svg class="graph-edges" viewBox="0 0 ${layout.width} ${layout.height}" width="${layout.width}" height="${layout.height}" aria-hidden="true">${edge}</svg>${nodes}</div></div>`;

function cloneScenario(sourceId, excludeIds=[], suffix='（複製）') {
  const src=data.scenarios.find(s=>s.id===sourceId);
  if (!src) return null;
  const newScenarioId=id();
  const idMap=new Map();
  const clonedActions=getScenarioActions(data,sourceId).filter(a=>!excludeIds.includes(a.id)).map(a=>{
    const newId=id(); idMap.set(a.id,newId);return {...a,id:newId,scenarioId:newScenarioId};
  });
  const clonedLinks=getScenarioLinks(data,sourceId).filter(l=>idMap.has(l.fromId)&&idMap.has(l.toId)).map(l=>({...l,id:id(),scenarioId:newScenarioId,fromId:idMap.get(l.fromId),toId:idMap.get(l.toId)}));
  const clonedItemLinks=data.actionItems.filter(rel=>idMap.has(rel.actionId)).map(rel=>({id:id(),itemId:rel.itemId,actionId:idMap.get(rel.actionId)}));
  data.scenarios.push({...src,id:newScenarioId,name:src.name+suffix,isBaseline:false});
  data.actions.push(...clonedActions);data.links.push(...clonedLinks);data.actionItems.push(...clonedItemLinks);
  selectedScenario=newScenarioId;selectedAction=null;
  return newScenarioId;
}
function deleteScenario(sid) {
  const removedActions=new Set(data.actions.filter(a=>a.scenarioId===sid).map(a=>a.id));
  data.actionItems=data.actionItems.filter(rel=>!removedActions.has(rel.actionId));
  data.links=data.links.filter(l=>l.scenarioId!==sid);
  data.actions=data.actions.filter(a=>a.scenarioId!==sid);
  data.scenarios=data.scenarios.filter(s=>s.id!==sid);
  data.timeLogs=data.timeLogs.filter(l=>l.scenarioId!==sid);
  if(activeTimer?.scenarioId===sid){activeTimer=null;persistTimer();}
  selectedScenario=null;selectedAction=null;
}
function deleteGoal(gid) {
  data.scenarios.filter(s=>s.goalId===gid).forEach(s=>deleteScenario(s.id));
  const removedItems=new Set(data.items.filter(item=>item.goalId===gid).map(item=>item.id));
  data.actionItems=data.actionItems.filter(rel=>!removedItems.has(rel.itemId));
  data.items=data.items.filter(item=>item.goalId!==gid);
  data.experiments=data.experiments.filter(e=>e.goalId!==gid);
  data.goals=data.goals.filter(g=>g.id!==gid);selectedGoal=null;
}
function stopNarrativeSpeech() {
 if (speechRecognizer) { const r=speechRecognizer; speechRecognizer=null; speechActive=false; try{r.abort();}catch{} }
}
function toggleNarrativeSpeech() {
 if(dialog?.type!=='narrative')return;
 if(speechRecognizer){stopNarrativeSpeech();renderDialog();return;}
 const Speech=speechRecognitionConstructor();
 if(!Speech){notify('このブラウザでは画面内マイクに対応していません。入力欄をタップし、iPhoneキーボードのマイクで話してください。',true);return;}
 try{
  const r=new Speech();r.lang='ja-JP';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{
   if(dialog?.type!=='narrative')return;
   const parts=[];
   for(let i=e.resultIndex??0;i<e.results.length;i++){const result=e.results[i];if(result.isFinal&&result[0]?.transcript)parts.push(result[0].transcript);}
   if(!parts.length)return;
   const textarea=modalRoot.querySelector('[name="narrativeText"]');if(!textarea)return;
   textarea.value=appendVoiceTranscript(textarea.value,parts.join('。'));
   textarea.dispatchEvent(new Event('input',{bubbles:true}));
  };
  r.onerror=e=>{if(e.error!=='aborted')notify('音声認識を完了できませんでした。キーボードの音声入力も利用できます。',true);};
  r.onend=()=>{if(speechRecognizer===r){speechRecognizer=null;speechActive=false;const el=modalRoot.querySelector('[data-action="toggle-narrative-voice"]');if(el)el.textContent='🎙 話して入力する';}};
  speechRecognizer=r;speechActive=true;r.start();
  const el=modalRoot.querySelector('[data-action="toggle-narrative-voice"]');if(el)el.textContent='■ 音声入力を停止';
 }catch{stopNarrativeSpeech();notify('マイクを利用できません。ブラウザの許可を確認するか、キーボードの音声入力をご利用ください。',true);}
}
async function organizeNarrativeWithAi(){
 if(dialog?.type!=='narrative'||narrativeAiBusy)return;
 const raw=modalRoot.querySelector('[name="narrativeText"]')?.value||'';
 let transcript;
 try{transcript=prepareVoiceTranscript(raw);}catch(err){notify(err.message,true);return;}
 if(!cloud?.userId){notify('AIでの整理にはクラウド画面からログインが必要です。ログイン前でも「端末内で候補を抽出」は使えます。',true);return;}
 const currentDialog=dialog, currentClient=cloud, currentWorkspace=activeStore;
 narrativeAiBusy=true;dialog={...currentDialog,raw,aiError:'',draft:null};
 renderDialog();
 const pendingDialog=dialog;
 try{
  const result=await currentClient.organizeActions(transcript);
  if(dialog!==pendingDialog||cloud!==currentClient||activeStore!==currentWorkspace)return;
  const existing=getScenarioActions(data,selectedScenario).map(x=>x.name);
  const draft=normalizeVoiceOrganization(result,existing);
  draft.unverified=Array.isArray(result.unverified)?result.unverified.slice(0,6).map(String):[];
  dialog={...pendingDialog,draft,aiError:''};
 }catch(err){if(dialog!==pendingDialog)return;dialog={...pendingDialog,aiError:err.message||'AI整理ができませんでした。'};}
 finally{narrativeAiBusy=false;if(dialog?.type==='narrative')renderDialog();}
}
function handleAction(el) {
  const type=el.dataset.action;
  if (!type) return;
  switch(type) {
    case 'overlap-edit': editingOverlapId=el.dataset.id;render();root.querySelector('#overlap-form')?.scrollIntoView?.({behavior:'smooth'});break;
    case 'overlap-cancel-edit': editingOverlapId=null;render();break;
    case 'overlap-remove': if(confirm('この並行作業の検討を削除しますか？')) mutate(()=>{data.overlapPlans=data.overlapPlans.filter(p=>p.id!==el.dataset.id);});break;
    case 'new-goal': dialog={type:'goal'};renderDialog();break;
    case 'edit-goal': dialog={type:'goal',id:selectedGoal};renderDialog();break;
    case 'edit-scenario-by-id': if(!data.scenarios.some(s=>s.id===el.dataset.id&&s.goalId===selectedGoal))return;dialog={type:'scenario',id:el.dataset.id};renderDialog();break;
    case 'new-scenario': if(!selectedGoal){notify('先に目的を追加してください',true);break;}dialog={type:'scenario'};renderDialog();break;
    case 'edit-scenario': dialog={type:'scenario',id:selectedScenario};renderDialog();break;
    case 'new-action': dialog={type:'action'};renderDialog();break;
    case 'new-item': dialog={type:'item'};renderDialog();break;
    case 'edit-item': dialog={type:'item',id:el.dataset.id};renderDialog();break;
    case 'quick-capture': if(!selectedScenario)return;dialog={type:'quick'};renderDialog();break;
    case 'narrative-capture': if(!selectedScenario)return;dialog={type:'narrative',raw:'',draft:null};renderDialog();break;
    case 'toggle-narrative-voice': toggleNarrativeSpeech();break;
    case 'organize-narrative-ai': organizeNarrativeWithAi();break;
    case 'parse-narrative': {
      if(dialog?.type!=='narrative')return;
      const input=modalRoot.querySelector('[name="narrativeText"]');
      const raw=input?.value || '';
      stopNarrativeSpeech();
      const currentNames=getScenarioActions(data,selectedScenario).map(a=>a.name);
      const parsed=parseNarrativeInput(raw,currentNames);
      const seen=new Set([...parsed.steps.map(s=>s.name),...currentNames].map(s=>s.toLocaleLowerCase('ja-JP')));

function handleDialogSubmit(form) {
  const read=(name)=>form.elements.namedItem(name)?.value?.trim()||'';
  const type=dialog?.type, idValue=dialog?.id;
  if(type==='goal') {
    const name=read('name'); if(!name)return;
    mutate(()=>{
      if(idValue)Object.assign(data.goals.find(g=>g.id===idValue),{name,description:read('description')});
      else {const gid=id();data.goals.push({id:gid,name,description:read('description'),createdAt:new Date().toISOString()});selectedGoal=gid;selectedScenario=null;}
      dialog=null;selectedAction=null;
    });
  } else if(type==='scenario') {
    const name=read('name');if(!name)return;
    mutate(()=>{
      const timings={setupMinutes:clamp(read('setupMinutes')),setupYen:clamp(read('setupYen')),managementMinutesPerWeek:clamp(read('managementMinutesPerWeek'))};
      if(idValue)Object.assign(data.scenarios.find(s=>s.id===idValue),{name,description:read('description'),...timings});
      else {const sid=id();data.scenarios.push({id:sid,goalId:selectedGoal,name,description:read('description'),...timings,isBaseline:!scenariosOfGoal().length});selectedScenario=sid;selectedAction=null;}
      dialog=null;
    });
  } else if(type==='item') {
    const name=read('name');if(!name)return;
    mutate(()=>{if(idValue)Object.assign(data.items.find(item=>item.id===idValue),{name,home:read('home'),note:read('note'),placement:read('placement')});
      else data.items.push({id:id(),goalId:selectedGoal,name,home:read('home'),note:read('note'),placement:read('placement')});dialog=null;});
  } else if(type==='narrative') {
    const parsed=dialog.draft;
    if(!parsed){notify('先に「候補を抽出・更新」を押してください。',true);return;}
    const activeIndices=parsed.steps.map((step,i)=>i).filter(i=>!parsed.steps[i].existing&&form.elements.namedItem(`include-${i}`)?.checked);
    const selectedSuggestions=(parsed.suggestions||[]).map((suggestion,i)=>({...suggestion,i})).filter(s=>form.elements.namedItem(`suggestion-${s.i}`)?.checked);
    if(!activeIndices.length&&!selectedSuggestions.length){notify('登録する行動を選んでください。',true);return;}
    if(selectedSuggestions.some(s=>!parsed.steps[s.parent].existing&&!activeIndices.includes(s.parent))){notify('派生候補を選ぶ場合は、発生元の行動も選んでください。',true);return;}
    const picked=activeIndices.map(i=>({i,name:read(`step-${i}`),kind:read(`kind-${i}`)}));
    if(picked.some(x=>!x.name)){notify('名前が空欄の行動があります。',true);return;}
    const present=new Set(getScenarioActions(data,selectedScenario).map(a=>a.name.toLocaleLowerCase('ja-JP')));
    for(const x of [...picked,...selectedSuggestions]){const k=x.name.toLocaleLowerCase('ja-JP');if(present.has(k)){notify('同じ名前の行動は登録できません。',true);return;}present.add(k);}
    const selectedSet=new Set(activeIndices);
    const candidateEdges=planNarrativeLinks(parsed,activeIndices,!!form.elements.namedItem('linkSequence')?.checked);
    let linked=0;
    mutate(()=>{
      const map=new Map();
      for(const [index,step] of parsed.steps.entries())if(step.existing){
        const found=getScenarioActions(data,selectedScenario).find(a=>a.name.toLocaleLowerCase('ja-JP')===step.name.toLocaleLowerCase('ja-JP'));if(found)map.set(index,found.id);
      }
      for(const x of picked){const aid=id();map.set(x.i,aid);data.actions.push({id:aid,scenarioId:selectedScenario,name:x.name,kind:x.kind,essential:false,minutes:null,frequency:1,yen:0,note:parsed.viaAi?(`AI整理による候補。要約: ${parsed.summary||''} / 未確認: ${(parsed.unverified||[]).join('、')} / 時間・頻度は再確認。`).slice(0,1000):'文章入力から登録。必要性と所要時間を後から確認。'});}
      for(const suggestion of selectedSuggestions){
        const aid=id();data.actions.push({id:aid,scenarioId:selectedScenario,name:suggestion.name,kind:suggestion.kind,essential:false,minutes:null,frequency:1,yen:0,note:'一般的な候補から登録。実際の必要性を必ず確認すること。'});
        const parentId=map.get(suggestion.parent);
        if(parentId&&canLink(data,selectedScenario,parentId,aid)){
          data.links.push({id:id(),scenarioId:selectedScenario,fromId:parentId,toId:aid,type:'causes'});linked++;
        }
      }
      // Explicit causal arrows may refer to previously registered actions. Sequence links only join selected new actions.
      for(const edge of [...parsed.links.filter(l=>selectedSet.has(l.from)||selectedSet.has(l.to)),...candidateEdges]){
        const fromId=map.get(edge.from),toId=map.get(edge.to);
        if(fromId&&toId&&canLink(data,selectedScenario,fromId,toId)){
          data.links.push({id:id(),scenarioId:selectedScenario,fromId,toId,type:edge.type});linked++;
        }
      }
      selectedAction=null;dialog=null;
    });
    notify(`${picked.length+selectedSuggestions.length}件の行動と${linked}件の関係を登録しました。内容を確認してください。`);
  } else if(type==='quick') {
    const parsed=parseActionLines(read('lines'),getScenarioActions(data,selectedScenario).map(a=>a.name));
    if(!parsed.names.length){notify('登録できる新しい行動がありません。',true);return;}
    const connect=form.elements.namedItem('linkSequence').checked;
    mutate(()=>{
      let prev=null;
      for(const name of parsed.names){const aid=id();data.actions.push({id:aid,scenarioId:selectedScenario,name,kind:'support',essential:false,minutes:null,frequency:1,yen:0,note:''});
        if(connect && prev && canLink(data,selectedScenario,prev,aid))data.links.push({id:id(),scenarioId:selectedScenario,fromId:prev,toId:aid,type:'precedes'});
        prev=aid;
      }
      selectedAction=null;dialog=null;
    });
    notify(`${parsed.names.length}件の行動を登録しました。${parsed.skipped.length?'重複など'+parsed.skipped.length+'件は除外。':''}${parsed.truncated?'31件目以降は再入力してください。':''}`);
  } else if(type==='action') {
    const name=read('name');if(!name)return;
    const values={name,kind:read('kind'),minutes:read('minutes')===''?null:clamp(read('minutes')),frequency:clamp(read('frequency'),10000),yen:clamp(read('yen')),essential:form.elements.namedItem('essential').checked,note:read('note')};
    mutate(()=>{
      if(idValue)Object.assign(data.actions.find(a=>a.id===idValue),values);
      else {const aid=id();data.actions.push({id:aid,scenarioId:selectedScenario,...values});selectedAction=aid;}
      dialog=null;
    });
  } else if(type==='link') {
    const fromId=read('fromId'),toId=read('toId');
    if(!canLink(data,selectedScenario,fromId,toId)){notify('同じ行動・重複する関係・循環する関係は登録できません。',true);return;}
    mutate(()=>{data.links.push({id:id(),scenarioId:selectedScenario,fromId,toId,type:read('type')});dialog=null;});notify('行動の関係を追加しました。');
  }
}
async function syncCloud(direction) {

   if(direction==='pull'){
     if(!remote){notify('クラウドにはまだ記録がありません。',true);return;}

     const incremental={...restored,links:[]};

     client.revision=Number(remote.revision);cloudLinked=true;cloudDirty=false;lastSyncedHash=hashPayload(data);rememberCloudLink();cloudStatus='クラウドから取得しました。以後の変更は自動で送信します。';cloudError='';
   } else {

     if(remote && !confirm(`クラウドにある記録を、この端末の内容で置き換えます。\n${changeSummaryText(migrateData(remote.payload),data)}\n\nクラウドの現在データを端末内に退避します。別途JSONも保存してください。`))return;
     if(!remote && !confirm('現在の端末のデータをクラウドに初めて保存しますか？'))return;
     if(remote)saveRecoveryPoint(recoveryScope(),migrateData(remote.payload),'クラウド上書き前');
     const uploaded=deepCopy(data), uploadedHash=hashPayload(uploaded);
     await client.writeSnapshot(uploaded,remote?Number(remote.revision):null);
     if(!isCurrentCloud(client,workspace))throw new Error('同期中のアカウントが変更されました。');
     cloudLinked=true;cloudDirty=hashPayload(data)!==uploadedHash;lastSyncedHash=uploadedHash;rememberCloudLink();cloudStatus=cloudDirty?'クラウドへ保存しました。追加の変更を同期します。':'クラウドへ保存しました。以後の変更は自動で送信します。';cloudError='';
     if(cloudDirty)scheduleCloudPush();
   }
 }catch(err){cloudLinked=false;cloudStatus='同期停止。ローカルの記録は保持しています。';cloudError=err.message;}
 finally{cloudBusy=false;render();}
}

  if(ev.target.id==='profit-scenario-select'){selectedScenario=ev.target.value;render();return;}
  if(ev.target.id==='profit-horizon'){horizonWeeks=Number(ev.target.value)||12;render();return;}
  if(ev.target.id==='profit-hourly-rate'){const raw=ev.target.value;timeYenPerHour=raw===''?null:Number(raw);if(timeYenPerHour!==null && (!Number.isFinite(timeYenPerHour)||timeYenPerHour<0||timeYenPerHour>1e9)){notify('評価額は0以上の数値です。',true);return;}render();return;}
  if(ev.target.id==='time-horizon'){horizonWeeks=Math.max(1,Math.min(260,Number(ev.target.value)||12));render();return;}
  if(ev.target.id==='ai-goal-select'){selectedGoal=ev.target.value;selectedScenario=scenariosOfGoal()[0]?.id||null;selectedAction=null;aiSuggestions=[];render();return;}
  if(ev.target.id==='ai-scenario-select'){selectedScenario=ev.target.value;aiSuggestions=[];render();return;}
  if(ev.target.id==='environment-scenario'){selectedScenario=ev.target.value;render();return;}
  if(ev.target.id==='goal-select'){selectedGoal=ev.target.value;selectedScenario=null;selectedAction=null;render();return;}
  if(ev.target.id==='import-file'){
    const file=ev.target.files?.[0];if(!file)return;
    if(!confirm(cloudLinked?'現在のデータを置き換え、クラウドにも同期します。事前にJSONバックアップを取りましたか？':'現在のデータをバックアップの内容で置き換えますか？'))return;
    try{
      if(file.size>3*1024*1024)throw new Error('ファイルが大きすぎます。');
      const imported=migrateData(JSON.parse(await file.text()));
      // Reject cyclic links in imported data before using the flow renderer.
      const incremental={...imported,links:[]};
      for(const l of imported.links){if(!canLink(incremental,l.scenarioId,l.fromId,l.toId))throw new Error('行動の関係に循環または重複があります。');incremental.links.push(l);}
      saveRecoveryPoint(recoveryScope(),data,'JSON取り込み前');
      undoSnapshot={data:deepCopy(data),selectedGoal,selectedScenario,selectedAction,activeTab};
      data=deepCopy(imported);selectedGoal=data.goals[0]?.id||null;selectedScenario=null;selectedAction=null;save();render();notify('データを復元しました。直後なら「元に戻す」で復旧できます。');
    }catch(err){notify(`読み込みできませんでした: ${err.message}`,true);}
  }
});
root.addEventListener('submit',ev=>{
  if(ev.target.id==='profit-form'){
    ev.preventDefault();const f=ev.target,chosen=scenario();
    if(!chosen){notify('方法を選択してください。',true);return;}
    try{const val=k=>f.elements.namedItem(k)?.value??'';
      const returns=returnsFromForm({cashIncomeOnce:val('cashIncomeOnce'),cashIncomePerWeek:val('cashIncomePerWeek'),timeIncomeOnceMinutes:val('timeIncomeOnceMinutes'),timeIncomePerWeekMinutes:val('timeIncomePerWeekMinutes'),qualityConfirmed:!!f.elements.namedItem('qualityConfirmed')?.checked,note:val('note')});
      mutate(()=>{chosen.returns=returns;});notify('収入・成果を保存しました。');
    }catch(err){notify(err.message,true);}return;
  }
  if(ev.target.id==='overlap-form') {
    ev.preventDefault();
    const f=ev.target;
    const get=k=>String(f.elements.namedItem(k)?.value??'');
    const checked=k=>!!f.elements.namedItem(k)?.checked;
    try {
      const p=overlapFromForm({name:get('name'),waitTask:get('waitTask'),otherTask:get('otherTask'),
        setupMinutes:get('setupMinutes'),waitMinutes:get('waitMinutes'),otherMinutes:get('otherMinutes'),
        finishMinutes:get('finishMinutes'),switchMinutes:get('switchMinutes'),weeklyFrequency:get('weeklyFrequency'),
        safeConfirmed:checked('safeConfirmed'),independentConfirmed:checked('independentConfirmed'),existingWorkConfirmed:checked('existingWorkConfirmed')},editingOverlapId||id());
      if(!editingOverlapId && (data.overlapPlans||[]).length>=500)throw new Error('これ以上の並行作業は保存できません。');
      mutate(()=>{if(editingOverlapId){const index=data.overlapPlans.findIndex(x=>x.id===editingOverlapId);if(index===-1)throw new Error('編集元のデータがありません。');data.overlapPlans[index]=p;}else data.overlapPlans.push(p);editingOverlapId=null;});notify('並行作業の条件と試算を保存しました。');
    }catch(err){notify(err.message,true);}return;
  }
  if(ev.target.id==='cloud-config-form') {
    ev.preventDefault();const f=ev.target;
    try {
      const config=validCloudConfig({url:f.elements.namedItem('url').value,publishableKey:f.elements.namedItem('publishableKey').value});
      const changed=!cloud||cloud.config.url!==config.url||cloud.config.publishableKey!==config.publishableKey;
      if(changed && cloud?.userId){notify('同期先を変更する前にログアウトし、アカウントを確認してください。',true);return;}
      cloud=new CloudClient(config);cloud.onSessionChange=session=>session?localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(session)):localStorage.removeItem(CLOUD_SESSION_KEY);
      localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(config));
      if(changed){localStorage.removeItem(CLOUD_SESSION_KEY);localStorage.removeItem(CLOUD_LINK_KEY);cloudLinked=false;cloudStatus='設定を保存しました。ログインしてください。';}
      render();
    }catch(err){notify(err.message,true);}return;
  }
  if(ev.target.id==='cloud-auth-form') {
    ev.preventDefault();
    if(cloudBusy)return;
    if(!cloud){cloudStatus='Supabase接続先を確認できません。';cloudError='画面下の接続先設定を確認してください。';render();return;}
    const f=ev.target;
    const intent=ev.submitter?.value==='login'?'login':'signup';
    const email=String(f.elements.namedItem('email')?.value||'').trim();
    const password=f.elements.namedItem('password')?.value||'';
    authEmailDraft=email;
    if(!email.includes('@')||password.length<6){cloudStatus='メールアドレスとパスワード（6文字以上）を入力してください。';cloudError='入力内容を確認してください。';render();return;}
    cloudBusy=true;
    const buttons=f.querySelectorAll?.('button[type="submit"]')||[];
    for(const b of buttons)b.disabled=true;
    const feedback=root.querySelector?.('.auth-feedback');
    if(feedback)feedback.textContent=intent==='signup'?'新規登録を送信しています…':'ログインしています…';
    (async()=>{
      try {
        if(intent==='signup'){
          await cloud.signUp(email,password);
          cloudStatus='登録を受け付けました。確認メールを開いてください。届かない場合は迷惑メールも確認してください。';
        }else{
          await cloud.signIn(email,password);
          try{switchWorkspace(cloud.session);}catch(e){cloud.signOutLocal();throw e;}
          cloudStatus='ログインしました。同期する方向を選んでください。ログイン前の記録はゲスト領域に残っています。';
          await bootstrapCloud();
        }
        cloudError='';
        notify(intent==='signup'?'登録受付：確認メールを確認してください。':'ログインが完了しました。');
      }catch(err){
        cloudError=err?.message||'通信エラーが発生しました。';
        cloudStatus=intent==='signup'?'新規登録に失敗しました。入力内容と通信状況をご確認ください。':'ログインに失敗しました。';
        notify(`${cloudStatus} ${cloudError}`,true);
      }finally{cloudBusy=false;render();}
    })();return;
  }
  if(ev.target.id==='password-reset-request-form'){
    ev.preventDefault();if(!cloud||cloudBusy)return;
    const email=ev.target.elements.namedItem('email').value;
    cloudBusy=true;render();
    cloud.requestPasswordReset(email).then(()=>{cloudStatus='再設定メールを受け付けました。届いたリンクから再設定してください。';cloudError='';}).catch(err=>{cloudError=err.message;cloudStatus='再設定メールの送信に失敗しました。';}).finally(()=>{cloudBusy=false;render();});
    return;
  }
  if(ev.target.id==='password-reset-confirm-form'){
    ev.preventDefault();if(!cloud?.userId||cloudBusy||!passwordRecoveryActive)return;
    const password=ev.target.elements.namedItem('password').value;
    cloudBusy=true;render();
    cloud.updatePassword(password).then(()=>{passwordRecoveryActive=false;cloudStatus='パスワードを更新しました。';cloudError='';}).catch(err=>{cloudError=err.message;cloudStatus='パスワード変更に失敗しました。';}).finally(()=>{cloudBusy=false;render();});
    return;
  }
  if(ev.target.id==='paired-log-form') {
    ev.preventDefault();
    try {
      const f=ev.target;
      const beforeLogId=f.elements.namedItem('beforeLogId').value;
      const afterLogId=f.elements.namedItem('afterLogId').value;
      const pair=compareMeasurementPair(data,beforeLogId,afterLogId,!!f.elements.namedItem('equalWorkload').checked);
      if((data.experiments||[]).some(e=>e.comparisonScope==='one_cycle'&&e.sourceLogIds?.[0]===beforeLogId&&e.sourceLogIds?.[1]===afterLogId))throw new Error('この組み合わせはすでに比較済みです。');
      mutate(()=>data.experiments.push({id:id(),...pair,beforeName:data.scenarios.find(s=>s.id===pair.beforeId)?.name||'',afterName:data.scenarios.find(s=>s.id===pair.afterId)?.name||'',beforeActualMinutes:null,afterActualMinutes:null,plannedTotalsComplete:false,plannedBeforeMinutes:scenarioTotals(data,pair.beforeId).minutes,plannedAfterMinutes:scenarioTotals(data,pair.afterId).minutes,note:'同じ作業量・対象範囲での1回分の実測比較（利用者が確認）',createdAt:new Date().toISOString()}));
      notify(`実測1回分の差 ${fmtMin(Math.abs(pair.savedMinutes))} を記録しました。`);
    }catch(err){notify(err.message,true);}return;
  }
  if(ev.target.id!=='experiment-form')return;
  ev.preventDefault();const form=ev.target;
  const beforeId=form.elements.namedItem('beforeId').value,afterId=form.elements.namedItem('afterId').value;
  if(beforeId===afterId){notify('異なる二つの方法を指定してください。',true);return;}
  const beforeObserved=form.elements.namedItem('beforeActualMinutes').value;
  const afterObserved=form.elements.namedItem('afterActualMinutes').value;
  const beforeTotalRaw=form.elements.namedItem('beforeTotalActualMinutes').value;
  const afterTotalRaw=form.elements.namedItem('afterTotalActualMinutes').value;
  if((beforeTotalRaw.trim()==='')!==(afterTotalRaw.trim()==='')){notify('総時間の実測は変更前・変更後の両方を入力してください。',true);return;}
  mutate(()=>data.experiments.push({id:id(),goalId:selectedGoal,beforeId,afterId,
    beforeTotalActualMinutes:beforeTotalRaw.trim()===''?null:clamp(beforeTotalRaw),
    afterTotalActualMinutes:afterTotalRaw.trim()===''?null:clamp(afterTotalRaw),
    actualObservationWeeks:Math.max(1,Math.min(260,Number(form.elements.namedItem('actualObservationWeeks').value)||4)),
    plannedHorizonWeeks:horizonWeeks,plannedBeforeTotalMinutes:projectTime(data,beforeId,horizonWeeks).totalMinutes,plannedAfterTotalMinutes:projectTime(data,afterId,horizonWeeks).totalMinutes,plannedTotalsComplete:projectTime(data,beforeId,horizonWeeks).complete&&projectTime(data,afterId,horizonWeeks).complete,
    beforeActualMinutes:beforeObserved.trim()===''?null:clamp(beforeObserved),afterActualMinutes:afterObserved.trim()===''?null:clamp(afterObserved),note:form.elements.namedItem('note').value.trim(),beforeName:data.scenarios.find(s=>s.id===beforeId)?.name||'',afterName:data.scenarios.find(s=>s.id===afterId)?.name||'',plannedBeforeMinutes:scenarioTotals(data,beforeId).minutes,plannedAfterMinutes:scenarioTotals(data,afterId).minutes,createdAt:new Date().toISOString()}));
  notify('検証記録を保存しました。');
});
modalRoot.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el)handleAction(el);});
modalRoot.addEventListener('input',ev=>{
  if(ev.target.name!=='narrativeText'||dialog?.type!=='narrative')return;
  dialog.raw=ev.target.value;
  if(dialog.draft){dialog.draft=null;const submit=modalRoot.querySelector('#dialog-form button[type="submit"]');if(submit)submit.disabled=true;}
});
modalRoot.addEventListener('submit',ev=>{if(ev.target.id==='dialog-form'){ev.preventDefault();handleDialogSubmit(ev.target);}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&dialog){stopNarrativeSpeech();dialog=null;renderDialog();}});
render();
// Concurrent tabs can share localStorage but not the in-memory editing state.
// Never silently overwrite changes made in another tab.
globalThis.addEventListener?.('storage', ev=>{
 if(ev.key!==activeStore || ev.newValue===null)return;
 try {
  const next=migrateData(JSON.parse(ev.newValue));
  if(hashPayload(next)!==hashPayload(data)){
   localTabConflict=true;cloudLinked=false;cloudDirty=false;
   cloudStatus='別タブで編集がありました。JSONをバックアップし、画面を再読込してから同期してください。';
   cloudError='同じブラウザの複数タブで同時編集しないでください。';
   notify('別タブで変更がありました。JSONバックアップを確認し、再読み込みしてください。',true);render();
  }
 }catch{}
});
async function handleAuthCallback(){
 const hash=globalThis.location?.hash||'';
 const callback=parseAuthCallback(hash);
 if(!callback)return;
 // Strip credentials from the address bar before any asynchronous work.
 try{globalThis.history?.replaceState?.(null,'',globalThis.location.pathname+globalThis.location.search);}catch{}
 activeTab='cloud';render();
 if(callback.error){cloudError=callback.error;cloudStatus='認証リンクを確認してください。';render();return;}
 if(!cloud){cloudError='Supabaseの接続設定を確認してください。';render();return;}
 const client=cloud;
 cloudBusy=true;render();
 try{
   const session=await client.acceptAuthRedirect(callback);
   if(client!==cloud)return;
   switchWorkspace(session);
   passwordRecoveryActive=callback.type==='recovery';
   cloudError='';cloudStatus=passwordRecoveryActive?'新しいパスワードを設定してください。':'メール認証が完了しました。同期する方向を選択してください。';
 }catch(err){cloudError=err.message;cloudStatus='認証リンクの処理に失敗しました。';}
 finally{cloudBusy=false;render();}
}
handleAuthCallback().then(()=>{if(cloud?.userId)bootstrapCloud();}).catch(()=>{cloudStatus='メール認証の処理に失敗しました。';render();});

// Refresh only the timer label; no UI redraw while the user edits forms.
if(typeof setInterval==='function')setInterval(()=>{if(!activeTimer)return;const el=document.querySelector('[data-timer-display]');if(el)el.textContent=elapsedLabel(activeTimer);},1000);

</script>
